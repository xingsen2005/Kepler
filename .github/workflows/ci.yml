# Kepler 对象存储管理系统 · 持续集成
#
# 为什么需要这个文件：`tests/` 下 1255 条护栏此前**没有任何自动化执行者** ——
# 全靠提交者在本机手动 `npm test`。「护栏写了但没人跑」与「没有护栏」在生产事故
# 面前是等价的，故这里补上最小闭环：安装依赖 → 静态检查 → 逐文件跑测试。
#
# ⚠️ 两个刻意的取舍，改动前请先读完：
#
# 1) **逐文件各起一个进程，而不是 `node --test "tests/**/*.test.js"`。**
#    本项目实测过：把全部文件交给一个 glob 会**卡死**（跨文件状态泄漏 + 单进程内存
#    累积），本地一直用 `for f in tests/*.test.js` 逐个跑。CI 必须与本地同口径，
#    否则「本地绿、CI 红」这种最难排查的差异会天天发生。
#    顺带的好处：node 18 的 `--test` 不支持 glob，逐文件写法对 18/20/22 都成立。
#
# 2) **不设置 `continue-on-error`，也不忽略非零退出码。** 一条测试红就是红。
#    唯一的例外是「本机没有 bash」的部署脚本用例：它们在 Linux 上**全部真跑**，
#    在 Windows 上靠 Git Bash 也能跑；真跑不了时用例自己会 `skip` 并写清原因，
#    不会伪装成通过。
name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (node ${{ matrix.node }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['18', '20', '22']
        exclude:
          # Windows 只跑一个版本：Windows 侧的失败几乎都是「bash / 路径 / 换行」这类
          # 与 Node 版本无关的问题，跑三遍不会多发现任何东西，只会把 CI 时间翻三倍。
          - os: windows-latest
            node: '18'
          - os: windows-latest
            node: '20'
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: 安装依赖（严格按 lockfile）
        run: npm ci

      - name: 静态检查（eslint 未安装时自动跳过，返回 0）
        run: npm run lint

      - name: 逐文件跑测试
        shell: bash
        run: |
          set -u
          total=0; failed=0; skipped=0
          for f in tests/*.test.js; do
            total=$((total + 1))
            out=$(node --test "$f" 2>&1); rc=$?
            s=$(printf '%s\n' "$out" | grep -m1 '^# skipped ' | awk '{print $3}')
            skipped=$((skipped + ${s:-0}))
            if [ "$rc" != "0" ]; then
              failed=$((failed + 1))
              echo "::group::FAILED $f"
              printf '%s\n' "$out"
              echo "::endgroup::"
            fi
          done
          echo "文件总数 $total · 失败 $failed · 跳过用例 $skipped"
          if [ "$failed" != "0" ]; then
            echo "有 $failed 个测试文件未通过" >&2
            exit 1
          fi
